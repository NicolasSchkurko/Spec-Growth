schema: spec-anchored

# Project test command. Used by `gate-check --run-tests` to record real evidence.
# Examples: "./gradlew test" (Linux/macOS) · "gradlew.bat test" (Windows) · "npm test" · "pytest -q"
# test_command: ""

context: |
  <!-- Fill in: project stack, conventions and how to run the tests -->

rules:
  proposal:
    - Declare kind (fix|feature|architecture|refactor), targets, tests and deps in .openspec.yaml
    - Short: why and what. The how goes in design.md, only if kind=architecture
    - Persistence/state, concurrency, networking, platform SDKs, security or a new dependency → tech_brief: true → walkthrough + comprehension sign-off before archiving
  specs:
    - Requirements in SHALL; concrete WHEN/THEN scenarios
    - Every requirement carries a [@test] line with the path of the test verifying it
  tasks:
    - Verifiable checklist; small tasks, each one completable and probable

# Protected zones: changes touching these globs require explicit human approval
# (`human_approved: true` in the change, indicated by the human). They show up in BOARD.md.
# Example:
# protected:
#   - glob: "app/src/main/**/storage/**"
#     reason: "persistence — user data"
#   - glob: "**/auth/**"
#     reason: "authentication"
protected: []
